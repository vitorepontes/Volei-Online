<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci minha senha - Vôlei Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2>Vôlei Online</h2>
    <button class="nav-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="menuPrincipal">
        <span></span><span></span><span></span>
    </button>
    <nav id="menuPrincipal">
        <a href="index.html">Home</a>
        <a href="aulas.html">Aulas</a>
        <a href="noticias.html">Notícias</a>
        <a href="agenda.html">Agenda</a>
        <a href="forum.html">Fórum</a>
        <a href="login.html" class="nav-conta ativo">Login</a>
    </nav>
</header>

<div class="auth-wrapper">
    <div class="auth-box">

        <div class="auth-logo">
            <h2>🏐 Vôlei Online</h2>
            <p>Redefinir senha</p>
        </div>

        <form id="formEsqueciSenha" class="auth-form ativo" novalidate>
            <div id="msgEsqueciSenha" class="msg" role="status"></div>

            <div class="campo">
                <label for="email">E-mail da conta</label>
                <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required>
                <small>Vamos enviar um link de redefinição para esse e-mail, caso exista uma conta cadastrada.</small>
            </div>

            <button type="submit" class="btn btn-primary" id="btnEnviar">Enviar link de redefinição</button>
        </form>

        <div class="voltar-home">
            <a href="login.html">← Voltar para o login</a>
        </div>

    </div>
</div>

<script src="app.js"></script>
<script>
function mostrarMensagem(texto, tipo) {
    const el = document.getElementById('msgEsqueciSenha');
    el.textContent = texto;
    el.className = `msg ${tipo} visivel`;
}

document.getElementById('formEsqueciSenha').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnEnviar');
    btn.disabled = true;
    btn.classList.add('carregando');
    btn.textContent = 'Enviando...';

    const email = document.getElementById('email').value;

    try {
        const res = await fetch('/esqueci-senha', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        const dados = await res.json();

        if (res.ok) {
            mostrarMensagem('✅ ' + dados.mensagem, 'sucesso');
            document.getElementById('formEsqueciSenha').reset();
        } else {
            mostrarMensagem(dados.erro || 'Não foi possível processar o pedido.', 'erro');
        }
    } catch {
        mostrarMensagem('❌ Erro ao conectar com o servidor.', 'erro');
    } finally {
        btn.disabled = false;
        btn.classList.remove('carregando');
        btn.textContent = 'Enviar link de redefinição';
    }
});
</script>

</body>
</html>
