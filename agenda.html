<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda - Vôlei Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h2>Vôlei Online</h2>
    <button class="nav-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="menuPrincipal">
        <span></span><span></span><span></span>
    </button>
    <nav id="menuPrincipal">
        <a href="index.html">Home</a>
        <a href="aulas.html">Aulas</a>
        <a href="noticias.html">Notícias</a>
        <a href="agenda.html" class="ativo">Agenda</a>
        <a href="forum.html">Fórum</a>
        <a href="login.html" class="nav-conta">Login</a>
    </nav>
</header>

<h1 class="titulo">Agenda Oficial de Eventos</h1>

<div class="toggle-modalidade" role="tablist" aria-label="Modalidade">
    <button type="button" class="toggle-opcao ativo" role="tab" aria-selected="true" data-modalidade="">Todas</button>
    <button type="button" class="toggle-opcao" role="tab" aria-selected="false" data-modalidade="quadra">🏐 Quadra</button>
    <button type="button" class="toggle-opcao" role="tab" aria-selected="false" data-modalidade="praia">🏖️ Praia</button>
</div>

<div class="container-agenda" id="container-agenda" aria-live="polite">
    <div class="estado-vazio"><span class="icone">📅</span>Carregando agenda...</div>
</div>

<script src="app.js"></script>
<script>
let modalidadeAtual = '';

// Escapa texto vindo do banco antes de inserir no HTML (evita quebra de layout/injeção)
function escapeHtml(valor) {
    return String(valor ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function criarItemHTML(ev, animar = false) {
    return `
    <div class="agenda-card${animar ? ' ia-novo' : ''}" data-id="${ev.id}">
        <div class="agenda-data">
            <span class="dia">${escapeHtml(ev.dia)}</span>
            <span class="mes">${escapeHtml(ev.mes)}</span>
        </div>
        <div class="agenda-info">
            <h3>${escapeHtml(ev.titulo)}</h3>
            ${ev.local ? `<p>📍 ${escapeHtml(ev.local)}</p>` : ''}
            ${ev.descricao ? `<p>${escapeHtml(ev.descricao)}</p>` : ''}
        </div>
    </div>`;
}

async function carregarAgenda() {
    const container = document.getElementById('container-agenda');
    try {
        const url = modalidadeAtual ? `/agenda?modalidade=${modalidadeAtual}` : '/agenda';
        const res = await fetch(url);
        if (!res.ok) throw new Error();
        const dados = await res.json();
        if (!dados.length) {
            container.innerHTML = `<div class="estado-vazio"><span class="icone">📭</span>Nenhum evento ${modalidadeAtual ? `de ${modalidadeAtual}` : 'cadastrado'} ainda.</div>`;
            return;
        }
        container.innerHTML = dados.map(ev => criarItemHTML(ev)).join('');
    } catch {
        container.innerHTML = `<div class="estado-vazio"><span class="icone">⚠️</span>Não foi possível conectar ao servidor.</div>`;
    }
}

document.querySelectorAll('.toggle-opcao').forEach(botao => {
    botao.addEventListener('click', () => {
        if (botao.dataset.modalidade === modalidadeAtual) return;
        document.querySelectorAll('.toggle-opcao').forEach(b => {
            b.classList.remove('ativo');
            b.setAttribute('aria-selected', 'false');
        });
        botao.classList.add('ativo');
        botao.setAttribute('aria-selected', 'true');
        modalidadeAtual = botao.dataset.modalidade;
        carregarAgenda();
    });
});

setInterval(() => carregarAgenda(), 5 * 60 * 1000);
carregarAgenda();
</script>
</body>
</html>
